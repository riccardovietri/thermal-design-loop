name: gpu_coldplate
requirements:
  heat_load_w: 1000
  footprint_width_mm: 60
  flow_length_mm: 60
  base_thickness_mm: 2.0     # fixed assumption; published designs span 0.1-4.5 mm
  solid_k_w_mk: 390          # copper
  coolant: PG25
  inlet_temp_c: 40
  dp_budget_kpa: 30          # channel core only
design_space:
  w_ch_mm: {min: 0.15, max: 1.0, levels: 8, spacing: geometric}
  t_fin_mm: {min: 0.15, max: 1.0, levels: 6, spacing: geometric}
  h_fin_mm: {min: 1.0, max: 4.0, levels: 7, spacing: linear}
  flow_lpm: [1.0, 1.5, 2.0]
constraints:
  min_feature_mm: 0.15
  max_aspect_ratio: 10
study:
  n_cfd: 10
  mesh_cells_across_half_channel: 8
