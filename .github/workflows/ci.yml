name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run python validation/duct_fully_developed.py
      - run: uv run python run_study.py examples/gpu_coldplate.yaml
      - run: uv run python validation/level2_thermal_entrance.py
